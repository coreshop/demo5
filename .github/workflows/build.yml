name: Build

# Builds the three images of the demo and, on pushes to main, pushes them to the
# GitHub Container Registry (ghcr.io/coreshop/demo5/*) and bumps the image tags in the
# manifest repository. Secrets: GITHUB_TOKEN (packages: write) for the registry and the
# org secrets GH_APP_ID / GH_APP_PRIVATE_KEY of the coreshop GitHub App, which must be
# installed on the manifest repository with contents: write.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_BASE: ghcr.io/coreshop/demo5
  MANIFEST_REPO: coreshop/demo5-manifest

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: php-fpm, target: cors_php }
          - { name: php-supervisord, target: cors_php_supervisord }
          - { name: nginx, target: cors_nginx }
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=main-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BASE }}/${{ matrix.image.name }}:latest
          build-args: |
            APP_ENV=prod
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  manifest:
    name: Update manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Image tag
        id: tag
        run: echo "tag=main-$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: coreshop
          repositories: demo5-manifest

      - name: Checkout manifest
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: manifest

      - name: Set image tags
        working-directory: manifest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq -i '.appVersion = strenv(TAG)' Chart.yaml
          yq -i '.php.image.tag = strenv(TAG) | .php.supervisord.image.tag = strenv(TAG) | .nginx.image.tag = strenv(TAG)' values.yaml
          git config user.name "demo5-ci"
          git config user.email "demo5-ci@cors.gmbh"
          git commit -am "update image tag to $TAG" || echo "nothing to commit"
          # other repositories push to the same manifest, retry on a non fast-forward push
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
